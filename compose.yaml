# 本地开发基础设施。
# 安全基线：不映射公网端口（仅绑定本机回环 127.0.0.1）；数据库/缓存必须用强密码
# （通过 .env 注入，禁止使用 postgres/postgres 之类的默认口令）。生产请改用 compose-prod.yaml。
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 仅本机可见，不暴露到局域网/公网
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 仅本机可见，不暴露到局域网/公网
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redis-data:
  pgvector-data:
