# Nginx 生产配置。
# 职责：
#   - 对外只开 80/443（HTTP -> HTTPS 强制跳转）
#   - 托管 Vue 静态站点
#   - 把 /api、/analysis 反向代理到 backend（Java），backend 再在内网转发到 python-gis，
#     保证 python-gis / redis / pgvector 永不暴露到公网。
#   - /analysis 经 backend 代发而非直连 python，避免绕过鉴权的通道。
# SSL 证书挂载到容器 /etc/letsencrypt/live/<域名>/fullchain.pem（见 compose-prod.yaml）。

# 前端构建产物已 COPY 进 Nginx 镜像（docker/nginx.Dockerfile），目录不变。
upstream backend_app {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    # 默认配置占位，正式环境请改为：
    #   listen 443 ssl;
    #   server_name gis.example.com;
    #   ssl_certificate     /etc/letsencrypt/live/gis.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/gis.example.com/privkey.pem;
    # 并把下面的 history 重写保留给 HTTPS server；HTTP server 仅做 301 跳转。
    location / {
        rewrite ^(.*)$ https://$host$1 permanent;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # ---- TLS 强配置 ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # 前端上传/接口数据上限（与上传配额一致，防止大请求被默认限制拒绝）
    client_max_body_size 130m;

    # ---- Vue history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Java 后端（含鉴权）----
    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保证 JWT 握手与长连接
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # ---- 空间分析：统一经 backend 转发（python 不对外）----
    location /analysis/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }

    # ---- 隐藏管理/运维端点 ----
    location ~ ^/(actuator|env|heapdump|threaddump|trace|shutdown|metrics|config|discovery) {
        deny all;
        return 403;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.html;
    }
}