spring:
  application:
    name: lc4j-1
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 容器由 compose.yaml 强制要求强密码（REDIS_PASSWORD）。
      # 之前未注入时健康检查 DOWN、会话记忆静默失效；本地免密 Redis 可留空。
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/vectordb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  autoconfigure:
    exclude:
      # The project does not define Spring Data JDBC repositories. Keeping this
      # auto-configuration enabled forces Spring to connect to PostgreSQL during
      # startup just to resolve a dialect, which prevents the intended pgvector
      # fallback path from working when the local database is offline.
      - org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

ai:
  qwen:
    model-name: qwen3.7-flash-2026-07-15
    # OpenAI-compatible DashScope endpoint; override when deploying in another region.
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    router-model-name: ${DEEPSEEK_ROUTER_MODEL:deepseek-v4-flash}
spatial:
  atlas-mcp:
    # Optional Atlas GIS MCP Streamable-HTTP endpoint. Empty means local source guidance only.
    url: ${ATLAS_GIS_MCP_URL:}
    search-tool: ${ATLAS_GIS_MCP_SEARCH_TOOL:search_data}
  demo:
    enabled: ${SPATIAL_DEMO_ENABLED:false}
  knowledge-graph:
    url: ${SPATIAL_KNOWLEDGE_GRAPH_URL:}
    refresh-ttl-seconds: ${SPATIAL_KNOWLEDGE_GRAPH_REFRESH_TTL_SECONDS:300}
    # local: only local requests may preview/publish/rollback; token: requires X-Spatial-Graph-Token.
    admin-mode: ${SPATIAL_KNOWLEDGE_GRAPH_ADMIN_MODE:local}
    admin-token: ${SPATIAL_KNOWLEDGE_GRAPH_ADMIN_TOKEN:}
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  # 仅绑定本机回环地址，配合动态执行的 local 鉴权模式，最小化暴露面。可用 SERVER_ADDRESS 切换。
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Nginx 反代场景下正确解析 X-Forwarded-* 头（真实客户端 IP / 协议）。
  forward-headers-strategy: framework

# ===== 全局登录鉴权（JWT）=====
# AUTH_JWT_SECRET          JWT 签名密钥（>=32 字节随机串）。生产必须通过环境变量注入；
#                          未配置时启动生成随机密钥并告警（重启后旧令牌失效）。
# AUTH_JWT_TTL_MINUTES     令牌有效期（分钟），默认 12 小时。
# AUTH_ADMIN_USERNAME      引导管理员用户名（.env / 环境变量），默认 admin。
# AUTH_ADMIN_PASSWORD      引导管理员密码。生产必填；为空则启动时生成随机密码并告警。
# AUTH_CORS_ORIGINS        允许的跨域来源（逗号分隔）。生产只填正式域名。
app:
  auth:
    # false=竞赛现场免登录（所有本地 API 直接可用）；生产必须设 AUTH_ENABLED=true 并配齐下方密钥。
    enabled: ${AUTH_ENABLED:false}
    jwt-secret: ${AUTH_JWT_SECRET:}
    jwt-ttl-minutes: ${AUTH_JWT_TTL_MINUTES:720}
    jwt-issuer: lc4j-backend
    admin-username: ${AUTH_ADMIN_USERNAME:admin}
    admin-password: ${AUTH_ADMIN_PASSWORD:}
    cors-allowed-origins: ${AUTH_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:7173,http://127.0.0.1:7173}
    # 全局限流：单客户端（认证用户名优先，否则来源 IP）窗口内最大请求数
    rate-limit-enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    rate-limit-max: ${AUTH_RATE_LIMIT_MAX:300}
    rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    rate-limit-exclude-health-check: ${AUTH_RATE_LIMIT_EXCLUDE_HEALTH_CHECK:true}
  upload:
    # 上传安全加固：深度格式校验始终生效；AV 扫描需配置 UPLOAD_AV_URL 后启用
    antivirus-enabled: ${UPLOAD_AV_ENABLED:false}
    antivirus-url: ${UPLOAD_AV_URL:}
    antivirus-timeout-ms: ${UPLOAD_AV_TIMEOUT_MS:4000}
    global-quota-bytes: ${UPLOAD_GLOBAL_QUOTA_BYTES:-1}
    per-user-quota-bytes: ${UPLOAD_PER_USER_QUOTA_BYTES:-1}
    quota-window-seconds: ${UPLOAD_QUOTA_WINDOW_SECONDS:3600}
    file-retention-seconds: ${UPLOAD_FILE_RETENTION_SECONDS:86400}
    cleanup-enabled: ${UPLOAD_CLEANUP_ENABLED:true}
    cleanup-interval-seconds: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gis:
  python-service-url: ${GIS_PYTHON_SERVICE_URL:http://127.0.0.1:8000/analysis}
  amap-key: ${AMAP_KEY:}

# Backend no longer hosts the built frontend. Hitting the backend root redirects
# to the Vite dev server (override FRONTEND_URL when deploying elsewhere).
frontend:
  url: ${FRONTEND_URL:http://127.0.0.1:5173}

# RAG 知识库配置
rag:
  enabled: true
  auto-load: true
  min-score: 0.6  # 知识检索最低相似度阈值（0-1），越高越严格
  max-results: 3  # 每次检索最大返回结果数

agent:
  max-rounds: 8

# ===== 动态代码执行安全开关（均为环境变量，默认值以最小风险为准）=====
# DYNAMIC_EXECUTION_ENABLED=false        是否启用动态执行（默认关闭）
# DYNAMIC_EXECUTION_AUTH_MODE=token|local 鉴权模式（默认 local=仅本机）
# GIS_AGENT_EXEC_TOKEN=                   token 模式下的独立令牌，绝不复用 QWEN-APIKEY
# DYNAMIC_EXECUTION_TIMEOUT_MS=3000       单次执行硬超时（毫秒），超时强制终止 GraalJS
# DYNAMIC_EXECUTION_MAX_INPUT_BYTES=65536 输入数据最大字节数
# DYNAMIC_EXECUTION_MAX_OUTPUT_BYTES=65536 执行结果最大字节数
# DYNAMIC_EXECUTION_MAX_CONCURRENCY=4     最大并发执行数
# DYNAMIC_EXECUTION_POOL_SIZE=4           执行线程池大小

logging:
  level:
    dev.langchain4j: info
    dev.ai4j.openai4j: info
