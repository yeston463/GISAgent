spring:
  application:
    name: lc4j-1
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/vectordb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  autoconfigure:
    exclude:
      # The project does not define Spring Data JDBC repositories. Keeping this
      # auto-configuration enabled forces Spring to connect to PostgreSQL during
      # startup just to resolve a dialect, which prevents the intended pgvector
      # fallback path from working when the local database is offline.
      - org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration

ai:
  qwen:
    model-name: qwen3.7-flash-2026-07-15
    # OpenAI-compatible DashScope endpoint; override when deploying in another region.
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
spatial:
  atlas-mcp:
    # Optional Atlas GIS MCP Streamable-HTTP endpoint. Empty means local source guidance only.
    url: ${ATLAS_GIS_MCP_URL:}
    search-tool: ${ATLAS_GIS_MCP_SEARCH_TOOL:search_data}
  demo:
    enabled: ${SPATIAL_DEMO_ENABLED:false}
  knowledge-graph:
    url: ${SPATIAL_KNOWLEDGE_GRAPH_URL:}
    refresh-ttl-seconds: ${SPATIAL_KNOWLEDGE_GRAPH_REFRESH_TTL_SECONDS:300}
    # local: only local requests may preview/publish/rollback; token: requires X-Spatial-Graph-Token.
    admin-mode: ${SPATIAL_KNOWLEDGE_GRAPH_ADMIN_MODE:local}
    admin-token: ${SPATIAL_KNOWLEDGE_GRAPH_ADMIN_TOKEN:}
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  # 仅绑定本机回环地址，配合动态执行的 local 鉴权模式，最小化暴露面。可用 SERVER_ADDRESS 切换。
  address: ${SERVER_ADDRESS:127.0.0.1}

gis:
  python-service-url: ${GIS_PYTHON_SERVICE_URL:http://127.0.0.1:8000/analysis}
  amap-key: ${AMAP_KEY:}

# RAG 知识库配置
rag:
  enabled: true
  auto-load: true
  min-score: 0.6  # 知识检索最低相似度阈值（0-1），越高越严格
  max-results: 3  # 每次检索最大返回结果数

agent:
  max-rounds: 8

# ===== 动态代码执行安全开关（均为环境变量，默认值以最小风险为准）=====
# DYNAMIC_EXECUTION_ENABLED=false        是否启用动态执行（默认关闭）
# DYNAMIC_EXECUTION_AUTH_MODE=token|local 鉴权模式（默认 local=仅本机）
# GIS_AGENT_EXEC_TOKEN=                   token 模式下的独立令牌，绝不复用 QWEN-APIKEY
# DYNAMIC_EXECUTION_TIMEOUT_MS=3000       单次执行硬超时（毫秒），超时强制终止 GraalJS
# DYNAMIC_EXECUTION_MAX_INPUT_BYTES=65536 输入数据最大字节数
# DYNAMIC_EXECUTION_MAX_OUTPUT_BYTES=65536 执行结果最大字节数
# DYNAMIC_EXECUTION_MAX_CONCURRENCY=4     最大并发执行数
# DYNAMIC_EXECUTION_POOL_SIZE=4           执行线程池大小

logging:
  level:
    dev.langchain4j: debug
    dev.ai4j.openai4j: debug
