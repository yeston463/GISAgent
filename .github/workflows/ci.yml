name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java backend (Maven tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -q -B test

  python:
    name: Python GIS service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'share/**/frontend-arcgis1/package-lock.json'
      - name: Build frontend
        run: bash scripts/build-frontend.sh

  spatial-integration:
    name: Spatial API integration contract
    runs-on: ubuntu-latest
    env:
      QWEN-APIKEY: ci-placeholder
      RAG_AUTO_LOAD: "false"
      SPATIAL_DEMO_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python GIS runtime
        run: python -m pip install -r requirements.txt
      - name: Compile Java backend and resolve runtime classpath
        run: |
          ./mvnw -q -B -DskipTests compile
          ./mvnw -q -B dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt -Dmdep.includeScope=runtime
      - name: Start local services
        run: |
          python main.py > /tmp/gis-python.log 2>&1 &
          java -cp "target/classes:$(cat target/runtime-classpath.txt)" org.example.Lc4j1Application > /tmp/gis-java.log 2>&1 &
      - name: Wait for services
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/analysis/runtime >/dev/null && \
              curl --fail --silent http://127.0.0.1:8080/api/gis/context?memoryId=ci-health >/dev/null && exit 0
            sleep 1
          done
          echo "Services did not become ready" >&2
          exit 1
      - name: Verify spatial analysis contract
        run: python scripts/verify_spatial_analysis.py
      - name: Show service logs on failure
        if: failure()
        run: |
          cat /tmp/gis-python.log || true
          cat /tmp/gis-java.log || true
